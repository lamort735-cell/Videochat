<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoChat — Rencontres aléatoires</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: rgba(255,255,255,0.07);
      --accent: #7c6aff;
      --accent2: #ff6a9e;
      --accent3: #6affdb;
      --text: #f0eeff;
      --muted: #6b6a82;
      --danger: #ff4d6d;
      --success: #4dffb4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Background ambiance */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,106,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,106,158,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── ÉCRAN D'ACCUEIL ── */
    #screen-home {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 10;
      padding: 2rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .home-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 40px 80px rgba(0,0,0,0.4);
    }

    .field-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .select-wrapper {
      position: relative;
    }

    .country-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.2s;
      outline: none;
    }

    .country-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,255,0.15);
    }

    .select-arrow {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
    }

    .name-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input::placeholder { color: var(--muted); }

    .name-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,255,0.15);
    }

    .btn-start {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 8px 30px rgba(124,106,255,0.35);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124,106,255,0.5);
    }

    .btn-start:active { transform: scale(0.98); }

    /* ── ÉCRAN PRINCIPAL ── */
    #screen-chat {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      z-index: 10;
    }

    /* Header */
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(20px);
      z-index: 20;
    }

    .header-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    .status-pill.waiting {
      background: rgba(255,196,0,0.12);
      color: #ffc400;
      border: 1px solid rgba(255,196,0,0.2);
    }

    .status-pill.connected {
      background: rgba(77,255,180,0.12);
      color: var(--success);
      border: 1px solid rgba(77,255,180,0.2);
    }

    .status-pill.idle {
      background: rgba(107,106,130,0.15);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Main content */
    .chat-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Videos zone */
    .videos-zone {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      position: relative;
    }

    .video-block {
      position: relative;
      overflow: hidden;
      background: var(--surface);
    }

    .video-block:first-child {
      border-right: 1px solid var(--border);
    }

    .video-block video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-label {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 0.3rem 0.7rem;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--surface);
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 0 1rem;
    }

    /* Searching animation */
    .searching-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sidebar chat */
    .chat-sidebar {
      width: 300px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .sidebar-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }

    .msg {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #9b8cff);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.them {
      align-self: flex-start;
      background: var(--surface2);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
      max-width: 100%;
      text-align: center;
    }

    .chat-input-row {
      padding: 0.8rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      padding: 0.6rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--muted); }

    .btn-send {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-send:hover { background: #9b8cff; }
    .btn-send:active { transform: scale(0.92); }

    /* Controls bar */
    .controls-bar {
      padding: 0.9rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
    }

    .btn-ctrl {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.3rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ctrl:hover { border-color: rgba(255,255,255,0.2); background: var(--surface); }

    .btn-ctrl.muted { background: rgba(255,77,109,0.15); border-color: rgba(255,77,109,0.3); color: var(--danger); }

    .btn-next {
      padding: 0.65rem 2rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(124,106,255,0.3);
    }

    .btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(124,106,255,0.45); }
    .btn-next:active { transform: scale(0.97); }

    .btn-stop {
      background: rgba(255,77,109,0.1);
      border-color: rgba(255,77,109,0.25);
      color: var(--danger);
    }

    .btn-stop:hover { background: rgba(255,77,109,0.2) !important; }

    /* Responsive */
    @media (max-width: 768px) {
      .chat-sidebar { display: none; }
      .videos-zone { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .video-block:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* Transition */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- ══ ÉCRAN ACCUEIL ══ -->
<div id="screen-home">
  <div class="logo">VideoChat</div>
  <p class="tagline">Rencontres vidéo aléatoires</p>

  <div class="home-card fade-in">
    <div>
      <div class="field-label">Ton pseudo</div>
      <input class="name-input" id="input-name" type="text" placeholder="Anonyme" maxlength="20">
    </div>

    <div>
      <div class="field-label">Parler avec des gens de...</div>
      <div class="select-wrapper">
        <select class="country-select" id="select-country">
          <option value="ANY">🌐 Tous les pays</option>
          <optgroup label="Europe">
            <option value="FR">🇫🇷 France</option>
            <option value="BE">🇧🇪 Belgique</option>
            <option value="CH">🇨🇭 Suisse</option>
            <option value="DE">🇩🇪 Allemagne</option>
            <option value="ES">🇪🇸 Espagne</option>
            <option value="IT">🇮🇹 Italie</option>
            <option value="GB">🇬🇧 Royaume-Uni</option>
            <option value="NL">🇳🇱 Pays-Bas</option>
            <option value="PT">🇵🇹 Portugal</option>
            <option value="PL">🇵🇱 Pologne</option>
          </optgroup>
          <optgroup label="Amériques">
            <option value="US">🇺🇸 États-Unis</option>
            <option value="CA">🇨🇦 Canada</option>
            <option value="BR">🇧🇷 Brésil</option>
            <option value="MX">🇲🇽 Mexique</option>
            <option value="AR">🇦🇷 Argentine</option>
          </optgroup>
          <optgroup label="Asie / Océanie">
            <option value="JP">🇯🇵 Japon</option>
            <option value="KR">🇰🇷 Corée du Sud</option>
            <option value="IN">🇮🇳 Inde</option>
            <option value="AU">🇦🇺 Australie</option>
            <option value="CN">🇨🇳 Chine</option>
          </optgroup>
          <optgroup label="Afrique / Moyen-Orient">
            <option value="MA">🇲🇦 Maroc</option>
            <option value="DZ">🇩🇿 Algérie</option>
            <option value="TN">🇹🇳 Tunisie</option>
            <option value="SN">🇸🇳 Sénégal</option>
            <option value="TR">🇹🇷 Turquie</option>
          </optgroup>
        </select>
        <span class="select-arrow">▾</span>
      </div>
    </div>

    <button class="btn-start" onclick="startChat()">
      ▶ &nbsp; Commencer
    </button>
  </div>
</div>

<!-- ══ ÉCRAN CHAT ══ -->
<div id="screen-chat" style="display:flex;">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-logo">VideoChat</div>
    <div class="status-pill idle" id="status-pill">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Prêt</span>
    </div>
    <div style="font-size:0.8rem; color:var(--muted);" id="partner-country-display"></div>
  </div>

  <!-- Main -->
  <div class="chat-main">

    <!-- Vidéos -->
    <div class="videos-zone">

      <!-- Ma vidéo -->
      <div class="video-block">
        <video id="local-video" autoplay muted playsinline></video>
        <div class="video-label" id="my-label">Moi</div>
      </div>

      <!-- Partenaire -->
      <div class="video-block">
        <video id="remote-video" autoplay playsinline style="display:none;"></video>
        <div class="video-placeholder" id="remote-placeholder">
          <div id="placeholder-icon" class="avatar-circle">👤</div>
          <div class="placeholder-text" id="placeholder-msg">Cherche quelqu'un…</div>
        </div>
        <div class="video-label" id="partner-label" style="display:none;">Partenaire</div>
      </div>

    </div>

    <!-- Sidebar chat -->
    <div class="chat-sidebar">
      <div class="sidebar-header">💬 Messages</div>
      <div class="messages-list" id="messages"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" type="text" placeholder="Écrire…" maxlength="200">
        <button class="btn-send" onclick="sendMessage()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <button class="btn-ctrl" id="btn-mic" onclick="toggleMic()">
      🎤 Micro
    </button>
    <button class="btn-ctrl" id="btn-cam" onclick="toggleCam()">
      📷 Caméra
    </button>
    <button class="btn-next" id="btn-next" onclick="findNext()">
      ⚡ Suivant
    </button>
    <button class="btn-ctrl btn-stop" onclick="stopChat()">
      ✕ Quitter
    </button>
  </div>

</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // ── CONFIG ──
  // En local : laisser vide. Sur Railway : mettre l'URL Railway
  const SERVER_URL = window.location.origin;

  // ── STATE ──
  let socket, localStream, peer;
  let myName = 'Anonyme';
  let selectedCountry = 'ANY';
  let micOn = true, camOn = true;
  let isConnected = false;

  // ── DÉMARRAGE ──
  function startChat() {
    myName = document.getElementById('input-name').value.trim() || 'Anonyme';
    selectedCountry = document.getElementById('select-country').value;

    document.getElementById('screen-home').style.display = 'none';
    document.getElementById('screen-chat').style.display = 'flex';
    document.getElementById('my-label').textContent = myName;

    initMedia();
  }

  async function initMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local-video').srcObject = localStream;
      connectSocket();
    } catch (e) {
      alert('❌ Impossible d\'accéder à la caméra/micro.\nVérifie les permissions du navigateur.');
      console.error(e);
    }
  }

  // ── SOCKET ──
  function connectSocket() {
    socket = io(SERVER_URL);

    socket.on('connect', () => {
      console.log('Socket connecté:', socket.id);
      findPartner();
    });

    socket.on('waiting', () => {
      setStatus('waiting', '⏳ En attente…');
      setPlaceholder('searching', 'Recherche en cours…');
    });

    socket.on('ready', () => {
      setStatus('idle', 'Prêt');
      findPartner();
    });

    socket.on('match-found', ({ partnerId, isInitiator }) => {
      setStatus('connected', '✅ Connecté');
      setPlaceholder('hidden', '');
      isConnected = true;
      addSystemMessage('✅ Partenaire trouvé ! Dites bonjour 👋');
      startWebRTC(partnerId, isInitiator);
    });

    socket.on('signal', ({ from, signal }) => {
      if (peer) peer.signal(signal);
    });

    socket.on('partner-left', () => {
      isConnected = false;
      setStatus('idle', 'Déconnecté');
      setPlaceholder('avatar', 'Le partenaire est parti…');
      hideRemoteVideo();
      destroyPeer();
      addSystemMessage('❌ Le partenaire a quitté.');
      setTimeout(() => findPartner(), 1500);
    });

    socket.on('chat-message', ({ message }) => {
      addMessage(message, 'them');
    });
  }

  // ── WEBRTC ──
  function startWebRTC(partnerId, isInitiator) {
    destroyPeer();

    // SimplePeer via CDN
    peer = new SimplePeer({
      initiator: isInitiator,
      stream: localStream,
      trickle: true,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('signal', (signal) => {
      socket.emit('signal', { to: partnerId, signal });
    });

    peer.on('stream', (remoteStream) => {
      const remoteVideo = document.getElementById('remote-video');
      remoteVideo.srcObject = remoteStream;
      remoteVideo.style.display = 'block';
      document.getElementById('remote-placeholder').style.display = 'none';
      document.getElementById('partner-label').style.display = 'block';
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
    });

    peer.on('close', () => {
      hideRemoteVideo();
    });
  }

  function destroyPeer() {
    if (peer) {
      peer.destroy();
      peer = null;
    }
  }

  function hideRemoteVideo() {
    const v = document.getElementById('remote-video');
    v.srcObject = null;
    v.style.display = 'none';
    document.getElementById('remote-placeholder').style.display = 'flex';
    document.getElementById('partner-label').style.display = 'none';
  }

  // ── ACTIONS ──
  function findPartner() {
    setStatus('waiting', '🔍 Recherche…');
    setPlaceholder('searching', 'Recherche en cours…');
    socket.emit('find-partner', { country: selectedCountry });
  }

  function findNext() {
    isConnected = false;
    destroyPeer();
    hideRemoteVideo();
    clearMessages();
    socket.emit('next');
  }

  function stopChat() {
    destroyPeer();
    if (socket) socket.disconnect();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    document.getElementById('screen-chat').style.display = 'none';
    document.getElementById('screen-home').style.display = 'flex';
  }

  function toggleMic() {
    micOn = !micOn;
    localStream.getAudioTracks().forEach(t => t.enabled = micOn);
    const btn = document.getElementById('btn-mic');
    btn.textContent = micOn ? '🎤 Micro' : '🔇 Micro';
    btn.classList.toggle('muted', !micOn);
  }

  function toggleCam() {
    camOn = !camOn;
    localStream.getVideoTracks().forEach(t => t.enabled = camOn);
    const btn = document.getElementById('btn-cam');
    btn.textContent = camOn ? '📷 Caméra' : '🚫 Caméra';
    btn.classList.toggle('muted', !camOn);
  }

  // ── CHAT ──
  function sendMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message || !socket) return;
    socket.emit('chat-message', { message });
    addMessage(message, 'me');
    input.value = '';
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  });

  function addMessage(text, type) {
    const list = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  }

  function addSystemMessage(text) {
    addMessage(text, 'system');
  }

  function clearMessages() {
    document.getElementById('messages').innerHTML = '';
  }

  // ── UI HELPERS ──
  function setStatus(type, text) {
    const pill = document.getElementById('status-pill');
    const dot = document.getElementById('status-dot');
    const label = document.getElementById('status-text');
    pill.className = `status-pill ${type}`;
    dot.className = `dot ${type === 'waiting' ? 'pulse' : ''}`;
    label.textContent = text;
  }

  function setPlaceholder(type, text) {
    const icon = document.getElementById('placeholder-icon');
    const msg = document.getElementById('placeholder-msg');
    const placeholder = document.getElementById('remote-placeholder');
    placeholder.style.display = 'flex';

    if (type === 'searching') {
      icon.innerHTML = '';
      icon.className = '';
      const ring = document.createElement('div');
      ring.className = 'searching-ring';
      icon.appendChild(ring);
    } else {
      icon.className = 'avatar-circle';
      icon.textContent = '👤';
    }
    msg.textContent = text;
  }

  // Initialiser sur l'écran d'accueil
  document.getElementById('screen-chat').style.display = 'none';
  document.getElementById('screen-home').style.display = 'flex';
</script>

<!-- SimplePeer WebRTC -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>

</body>
